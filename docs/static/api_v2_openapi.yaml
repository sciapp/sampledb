components:
  responses:
    BadRequestErrorModel:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestErrorModel'
      description: 'Bad Request: Bad request syntax or unsupported method'
    ForbiddenErrorModel:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenErrorModel'
      description: "Forbidden: Request forbidden \u2014 authorization will not help"
    NotFoundErrorModel:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundErrorModel'
      description: 'Not Found: Nothing matches the given URI'
  schemas:
    ActionModel:
      properties:
        action_id:
          description: the ID of the action
          examples:
          - 1
          title: Action Id
          type: integer
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: the description of the action
          examples:
          - This is an example action.
          title: Description
        instrument_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the instrument the action belongs to
          examples:
          - 1
          title: Instrument Id
        is_hidden:
          description: whether the action is hidden from action lists
          examples:
          - false
          title: Is Hidden
          type: boolean
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: the name of the action
          examples:
          - Example Action
          title: Name
        schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: the schema of the action
          examples:
          - properties:
              name:
                title:
                  en: Name
                type: text
            required:
            - name
            title:
              en: Object Information
            type: object
          title: Schema
        type:
          anyOf:
          - const: sample
            type: string
          - const: measurement
            type: string
          - const: simulation
            type: string
          - const: custom
            type: string
          deprecated: true
          description: a string representation of the action type
          examples:
          - sample
          title: Type
        type_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the action type
          examples:
          - 1
          title: Type Id
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the user who created the action
          examples:
          - 1
          title: User Id
      required:
      - action_id
      - instrument_id
      - user_id
      - type
      - type_id
      - name
      - description
      - is_hidden
      - schema
      title: ActionModel
      type: object
    ActionTypeModel:
      properties:
        admin_only:
          description: whether the action type may only be used by administrators
          examples:
          - false
          title: Admin Only
          type: boolean
        name:
          description: the name of the action type
          examples:
          - Sample Creation
          title: Name
          type: string
        object_name:
          description: the name for objects created with actions of the action type
          examples:
          - Sample
          title: Object Name
          type: string
        type_id:
          description: the ID of the action type
          examples:
          - 1
          title: Type Id
          type: integer
      required:
      - type_id
      - name
      - object_name
      - admin_only
      title: ActionTypeModel
      type: object
    BadRequestErrorModel:
      properties:
        error:
          description: the HTTP error phrase
          examples:
          - Bad Request
          title: Error
          type: string
        error_details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: the details of the error
          examples:
          - input: null
            msg: Input should be an object
          title: Error Details
        message:
          description: the error message
          examples:
          - Unable to perform operation
          title: Message
          type: string
      required:
      - error
      - message
      title: BadRequestErrorModel
      type: object
    CommentModel:
      properties:
        comment_id:
          description: the ID of the comment
          examples:
          - 1
          title: Comment Id
          type: integer
        content:
          description: the content of the comment
          examples:
          - This is a comment.
          title: Content
          type: string
        object_id:
          description: the ID of the object the comment was posted for
          examples:
          - 1
          title: Object Id
          type: integer
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the user who posted the comment
          examples:
          - 1
          title: User Id
        utc_datetime:
          anyOf:
          - type: string
          - type: 'null'
          description: the datetime in UTC when the comment was posted, formatted
            as YYYY-MM-DD HH:MM:SS.ffffff
          examples:
          - '2026-01-02 03:04:05.678910'
          title: Utc Datetime
      required:
      - object_id
      - comment_id
      - user_id
      - utc_datetime
      - content
      title: CommentModel
      type: object
    DatabaseFileModel:
      properties:
        base64_content:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the base64 encoded content of the file
          examples:
          - ZXhhbXBsZQ==
          title: Base64 Content
        base64_preview_image:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the base64 encoded preview image for the file
          examples:
          - iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAFklEQVR4nGP8////fwY8gAmf5PBRAAAbbgQMid1tCwAAAABJRU5ErkJggg==
          title: Base64 Preview Image
        file_id:
          description: the ID of the file
          examples:
          - 1
          title: File Id
          type: integer
        hash:
          anyOf:
          - $ref: '#/components/schemas/HashInfoModel'
          - type: 'null'
          default: null
          description: optional hash information for the file
          examples:
          - algorithm: sha512
            hexdigest: ee26b0dd4af7e749aa1a8ee3c10ae9923f618980772e473f8819a5d4940e0db27ac185f8a0e1d5f84f88bc887fd67b143732c304cc5fa9ad8e6f57f50028a8ff
        object_id:
          description: the ID of the object the file belongs to
          examples:
          - 1
          title: Object Id
          type: integer
        original_file_name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the name of the file
          examples:
          - example.txt
          title: Original File Name
        preview_image_mime_type:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the MIME type for the file preview image
          examples:
          - image/png
          title: Preview Image Mime Type
        storage:
          description: the storage type for the file
          examples:
          - database
          title: Storage
          type: string
      required:
      - object_id
      - file_id
      - storage
      title: DatabaseFileModel
      type: object
    ForbiddenErrorModel:
      properties:
        error:
          description: the HTTP error phrase
          examples:
          - Bad Request
          title: Error
          type: string
        message:
          description: the error message
          examples:
          - Unable to perform operation
          title: Message
          type: string
      required:
      - error
      - message
      title: ForbiddenErrorModel
      type: object
    GroupId:
      type: integer
    GroupModel:
      properties:
        description:
          additionalProperties:
            type: string
          description: the description of the basic group
          examples:
          - en: This is an example basic group.
          title: Description
          type: object
        group_id:
          description: the ID of the basic group
          examples:
          - 1
          title: Group Id
          type: integer
        member_users:
          description: the list of users who are members of the basic group
          examples:
          - - href: https://example.com/api/v2/users/1
              user_id: 1
          items:
            $ref: '#/components/schemas/UserRef'
          title: Member Users
          type: array
        name:
          additionalProperties:
            type: string
          description: the name of the basic group
          examples:
          - en: Example Basic Group
          title: Name
          type: object
      required:
      - group_id
      - name
      - description
      - member_users
      title: GroupModel
      type: object
    HashInfoModel:
      properties:
        algorithm:
          description: the hash algorithm used
          examples:
          - sha512
          title: Algorithm
          type: string
        hexdigest:
          description: the hexadecimal representation of the hash
          examples:
          - ee26b0dd4af7e749aa1a8ee3c10ae9923f618980772e473f8819a5d4940e0db27ac185f8a0e1d5f84f88bc887fd67b143732c304cc5fa9ad8e6f57f50028a8ff
          title: Hexdigest
          type: string
      required:
      - hexdigest
      - algorithm
      title: HashInfoModel
      type: object
    HexString:
      type: string
    InstrumentLogCategoryModel:
      properties:
        category_id:
          description: the ID of the category
          examples:
          - 1
          title: Category Id
          type: integer
        title:
          description: the title of the category
          examples:
          - 1
          title: Title
          type: string
      required:
      - category_id
      - title
      title: InstrumentLogCategoryModel
      type: object
    InstrumentLogEntryModel:
      properties:
        author:
          description: the ID of the user who created the instrument log entry
          examples:
          - 1
          title: Author
          type: integer
        log_entry_id:
          description: the ID of the instrument log entry
          examples:
          - 1
          title: Log Entry Id
          type: integer
        versions:
          description: the versions of the instrument log entry
          examples:
          - - categories:
              - category_id: 1
                title: 1
              content: This is a log entry.
              content_is_markdown: false
              event_utc_datetime: '2026-01-02T03:04:05.678910'
              log_entry_id: 1
              utc_datetime: '2026-01-02 03:04:05'
              version_id: 1
          items:
            $ref: '#/components/schemas/InstrumentLogEntryVersionModel'
          title: Versions
          type: array
      required:
      - log_entry_id
      - author
      - versions
      title: InstrumentLogEntryModel
      type: object
    InstrumentLogEntryVersionModel:
      properties:
        categories:
          description: the categories of the instrument log entry
          examples:
          - - category_id: 1
              title: 1
          items:
            $ref: '#/components/schemas/InstrumentLogCategoryModel'
          title: Categories
          type: array
        content:
          description: the content of the instrument log entry
          examples:
          - This is a log entry.
          title: Content
          type: string
        content_is_markdown:
          description: whether the content of the instrument log entry is formatted
            in Markdown
          examples:
          - false
          title: Content Is Markdown
          type: boolean
        event_utc_datetime:
          anyOf:
          - type: string
          - type: 'null'
          description: the ISO formatted datetime in UTC of the event described in
            the instrument log entry
          examples:
          - '2026-01-02T03:04:05.678910'
          title: Event Utc Datetime
        log_entry_id:
          description: the ID of the instrument log entry the version belongs to
          examples:
          - 1
          title: Log Entry Id
          type: integer
        utc_datetime:
          description: the datetime in UTC when the instrument log entry version was
            created, formatted as YYYY-MM-DD HH:MM:SS
          examples:
          - '2026-01-02 03:04:05'
          title: Utc Datetime
          type: string
        version_id:
          description: the ID of the instrument log entry version
          examples:
          - 1
          title: Version Id
          type: integer
      required:
      - log_entry_id
      - version_id
      - utc_datetime
      - content
      - categories
      - event_utc_datetime
      - content_is_markdown
      title: InstrumentLogEntryVersionModel
      type: object
    InstrumentLogFileAttachmentModel:
      properties:
        base64_content:
          anyOf:
          - type: string
          - type: 'null'
          description: the base64 encoded content of the attached file
          examples:
          - ZXhhbXBsZQ==
          title: Base64 Content
        file_attachment_id:
          description: the ID of the file attachment
          examples:
          - 1
          title: File Attachment Id
          type: integer
        file_name:
          anyOf:
          - type: string
          - type: 'null'
          description: the name of the attached file
          examples:
          - example.txt
          title: File Name
        is_hidden:
          description: whether the file attachment is hidden
          examples:
          - false
          title: Is Hidden
          type: boolean
      required:
      - file_attachment_id
      - file_name
      - base64_content
      - is_hidden
      title: InstrumentLogFileAttachmentModel
      type: object
    InstrumentLogObjectAttachmentModel:
      properties:
        is_hidden:
          description: whether the object attachment is hidden
          examples:
          - false
          title: Is Hidden
          type: boolean
        object_attachment_id:
          description: the ID of the object attachment
          examples:
          - 1
          title: Object Attachment Id
          type: integer
        object_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the attached object
          examples:
          - 1
          title: Object Id
      required:
      - object_attachment_id
      - object_id
      - is_hidden
      title: InstrumentLogObjectAttachmentModel
      type: object
    InstrumentModel:
      properties:
        component_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the federation component ID of the instrument
          examples:
          - 1
          title: Component Id
        description:
          description: the description of the instrument, shown on the instrument
            page
          examples:
          - This is an example instrument.
          title: Description
          type: string
        fed_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the federated ID of the instrument
          examples:
          - 1
          title: Fed Id
        instrument_id:
          description: the ID of the instrument
          examples:
          - 1
          title: Instrument Id
          type: integer
        instrument_scientists:
          description: the list of instrument scientists for the instrument
          examples:
          - - 1
          items:
            type: integer
          title: Instrument Scientists
          type: array
        is_hidden:
          description: whether the instrument is hidden from object lists
          examples:
          - false
          title: Is Hidden
          type: boolean
        location_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the location of the instrument
          examples:
          - 1
          title: Location Id
        name:
          description: the name of the instrument
          examples:
          - Example Instrument
          title: Name
          type: string
        short_description:
          description: the short description of the instrument, shown in instrument
            lists
          examples:
          - This is an example instrument.
          title: Short Description
          type: string
      required:
      - instrument_id
      - name
      - short_description
      - description
      - is_hidden
      - instrument_scientists
      - location_id
      - fed_id
      - component_id
      title: InstrumentModel
      type: object
    LocationModel:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: the description of the location
          examples:
          - This is an example location.
          title: Description
        enable_object_assignments:
          description: whether objects may be assigned to the location
          examples:
          - true
          title: Enable Object Assignments
          type: boolean
        is_hidden:
          description: whether the location is hidden from location lists
          examples:
          - false
          title: Is Hidden
          type: boolean
        location_id:
          description: the ID of the location
          examples:
          - 1
          title: Location Id
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: the name of the location
          examples:
          - Example Location
          title: Name
        parent_location_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the parent location of the location
          examples:
          - 2
          title: Parent Location Id
        type_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the location type of the location
          examples:
          - -99
          title: Type Id
      required:
      - location_id
      - name
      - description
      - parent_location_id
      - type_id
      - is_hidden
      - enable_object_assignments
      title: LocationModel
      type: object
    LocationTypeModel:
      properties:
        location_type_id:
          description: the ID of the location type
          examples:
          - 1
          title: Location Type Id
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: the name of the location type
          examples:
          - Example Location Type
          title: Name
      required:
      - location_type_id
      - name
      title: LocationTypeModel
      type: object
    NonEmptyString:
      minLength: 1
      type: string
    NotFoundErrorModel:
      properties:
        error:
          description: the HTTP error phrase
          examples:
          - Bad Request
          title: Error
          type: string
        message:
          description: the error message
          examples:
          - Unable to perform operation
          title: Message
          type: string
      required:
      - error
      - message
      title: NotFoundErrorModel
      type: object
    ObjectLocationAssignmentModel:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: the description of the object location/responsible user assignment
          examples:
          - The object is stored on the example shelf.
          title: Description
        location_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the location the object is assigned to
          examples:
          - 1
          title: Location Id
        object_id:
          description: the ID of the object that is assigned to a location/responsible
            user
          examples:
          - 1
          title: Object Id
          type: integer
        responsible_user_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the responsible user the object is assigned to
          examples:
          - 1
          title: Responsible User Id
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the user who assinged the object to a location/responsible
            user
          examples:
          - 1
          title: User Id
        utc_datetime:
          anyOf:
          - type: string
          - type: 'null'
          description: the datetime in UTC when the object was assignment was created,
            formatted as YYYY-MM-DD HH:MM:SS
          examples:
          - '2026-01-02 03:04:05'
          title: Utc Datetime
      required:
      - object_id
      - location_id
      - responsible_user_id
      - user_id
      - description
      - utc_datetime
      title: ObjectLocationAssignmentModel
      type: object
    ObjectLogEntryModel:
      properties:
        data:
          additionalProperties: true
          description: the data of the log entry
          examples:
          - {}
          title: Data
          type: object
        is_imported:
          description: whether the object log entry was imported
          examples:
          - false
          title: Is Imported
          type: boolean
        log_entry_id:
          description: the ID of the object log entry
          examples:
          - 1
          title: Log Entry Id
          type: integer
        object_id:
          description: the ID of the object the log entry belongs to
          examples:
          - 1
          title: Object Id
          type: integer
        type:
          description: the type of the object log entry
          examples:
          - CREATE_OBJECT
          title: Type
          type: string
        user_id:
          description: the ID of the user who caused the object log entry
          examples:
          - 1
          title: User Id
          type: integer
        utc_datetime:
          description: the datetime in UTC when the object log entry was created,
            formatted as YYYY-MM-DD HH:MM:SS
          examples:
          - '2026-01-02 03:04:05'
          title: Utc Datetime
          type: string
      required:
      - log_entry_id
      - type
      - object_id
      - user_id
      - data
      - utc_datetime
      - is_imported
      title: ObjectLogEntryModel
      type: object
    ObjectReferenceModel:
      properties:
        component_uuid:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the UUID of the federation component the referenced object
            belongs to
          examples:
          - 59b4f08d-f2e6-4343-a155-9880e988cead
          title: Component Uuid
        eln_object_url:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the URL of the referenced object in its source ELN
          examples:
          - https://example.com/objects/A
          title: Eln Object Url
        eln_source_url:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the URL of the source ELN of the referenced object
          examples:
          - https://example.com
          title: Eln Source Url
        object_id:
          description: the ID of the referenced object
          examples:
          - 1
          title: Object Id
          type: integer
      required:
      - object_id
      title: ObjectReferenceModel
      type: object
    Permissions:
      enum:
      - 0
      - 1
      - 2
      - 3
      title: Permissions
      type: integer
    PermissionsModel:
      $ref: '#/components/schemas/Permissions'
    ProjectId:
      type: integer
    ProjectMemberGroupRefModel:
      properties:
        group_id:
          description: the ID of the referenced basic group
          examples:
          - 1
          title: Group Id
          type: integer
        href:
          description: the URL of the API endpoint for the referenced basic group
          examples:
          - https://example.com/api/v2/groups/1
          title: Href
          type: string
        permissions:
          $ref: '#/components/schemas/PermissionsModel'
          description: the permissions for the referenced basic group
          examples:
          - 1
      required:
      - group_id
      - permissions
      - href
      title: ProjectMemberGroupRefModel
      type: object
    ProjectMemberUserRefModel:
      properties:
        href:
          description: the URL of the API endpoint for the referenced user
          examples:
          - https://example.com/api/v2/users/1
          title: Href
          type: string
        permissions:
          $ref: '#/components/schemas/PermissionsModel'
          description: the permissions for the referenced user
          examples:
          - 1
        user_id:
          description: the ID of the referenced user
          examples:
          - 1
          title: User Id
          type: integer
      required:
      - user_id
      - permissions
      - href
      title: ProjectMemberUserRefModel
      type: object
    ProjectModel:
      properties:
        description:
          additionalProperties:
            type: string
          description: the description of the project group
          examples:
          - en: This is an example project group.
          title: Description
          type: object
        member_groups:
          description: the list of basic groups who are members of the project group
          examples:
          - - group_id: 1
              href: https://example.com/api/v2/groups/1
              permissions: 1
          items:
            $ref: '#/components/schemas/ProjectMemberGroupRefModel'
          title: Member Groups
          type: array
        member_users:
          description: the list of users who are members of the project group
          examples:
          - - href: https://example.com/api/v2/users/1
              permissions: 1
              user_id: 1
          items:
            $ref: '#/components/schemas/ProjectMemberUserRefModel'
          title: Member Users
          type: array
        name:
          additionalProperties:
            type: string
          description: the name of the project group
          examples:
          - en: Example Project Group
          title: Name
          type: object
        project_id:
          description: the ID of the project group
          examples:
          - 1
          title: Project Id
          type: integer
      required:
      - project_id
      - name
      - description
      - member_users
      - member_groups
      title: ProjectModel
      type: object
    Url:
      type: string
    UrlFileModel:
      properties:
        file_id:
          description: the ID of the file
          examples:
          - 1
          title: File Id
          type: integer
        object_id:
          description: the ID of the object the file belongs to
          examples:
          - 1
          title: Object Id
          type: integer
        storage:
          description: the storage type for the file
          examples:
          - url
          title: Storage
          type: string
        url:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the URL of the file
          examples:
          - https://example.com
          title: Url
      required:
      - object_id
      - file_id
      - storage
      title: UrlFileModel
      type: object
    UserId:
      type: integer
    UserModel:
      properties:
        affiliation:
          anyOf:
          - type: string
          - type: 'null'
          description: the affiliation of the user
          examples:
          - Example Institute
          title: Affiliation
        email:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: the email address of the user, only set when queried by administrators
