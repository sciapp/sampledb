                    description: the ID of the action type
                    examples:
                    - 1
                    title: Type Id
                    type: integer
                required:
                - type_id
                - name
                - object_name
                - admin_only
                title: ActionTypeModel
                type: object
          description: 'OK: Request fulfilled, document follows'
        '404':
          $ref: '#/components/responses/NotFoundErrorModel'
      summary: Get an action type.
