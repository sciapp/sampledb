                    title: Action Id
                    type: integer
                  description:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: the description of the action
                    examples:
                    - This is an example action.
                    title: Description
                  instrument_id:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    description: the ID of the instrument the action belongs to
                    examples:
