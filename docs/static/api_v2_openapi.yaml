          - type: 'null'
          description: the list of referencing objects
          examples:
          - component_uuid: 59b4f08d-f2e6-4343-a155-9880e988cead
            eln_object_url: https://example.com/objects/A
            eln_source_url: https://example.com
            object_id: 1
          title: Referencing Objects
        schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          description: the schema of the current object version
          examples:
          - properties:
              name:
                title:
                  en: Name
                type: text
            required:
            - name
            title:
              en: Object Information
            type: object
          title: Schema
        user_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: the ID of the user who created this object version
          examples:
          - 1
          title: User Id
        utc_datetime:
          anyOf:
          - type: string
          - type: 'null'
          description: the datetime in UTC when the current object version was created,
            formatted as YYYY-MM-DD HH:MM:SS
          examples:
          - '2026-01-02 03:04:05'
          title: Utc Datetime
        version_id:
          description: the ID of the current object version
          examples:
          - 0
          title: Version Id
          type: integer
      required:
      - object_id
      - version_id
      - action_id
      - user_id
      - utc_datetime
      - schema
      - data
      - fed_object_id
      - fed_version_id
      - component_id
      - referencing_objects
      title: _ObjectModel
      type: object
