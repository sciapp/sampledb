                    title: Type Id
                  user_id:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    description: the ID of the user who created the action
                    examples:
                    - 1
                    title: User Id
                required:
                - action_id
                - instrument_id
                - user_id
                - type
                - type_id
                - name
                - description
                - is_hidden
                - schema
