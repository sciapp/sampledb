paths:
  /access_tokens/:
    post:
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                description:
                  description: Description of the access token
                  examples:
                  - Access Token for Instrument Control
                  title: Description
                  type: string
              required:
              - description
              title: RequestBodyModel
              type: object
        required: false
      responses:
        '201':
          content:
            application/json:
              schema:
                properties:
                  access_token:
                    description: A token usable to authenticate with the API via HTTP
                      Bearer authentication
                    examples:
                    - be740310706c1050e7a1668e2c0c407e029559a862d544d2d059f363c9ad8219
                    title: Access Token
                    type: string
                  description:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: Description of the access token
                    examples:
                    - Access Token for Instrument Control
                    title: Description
                  expiration_utc_datetime:
                    description: A string containing the datetime (in UTC) when the
                      access token expires
                    examples:
                    - '2026-01-01 12:34:56'
                    title: Expiration Datetime
                    type: string
                  refresh_token:
                    description: A token usable to authenticate with the /access_tokens/
                      endpoint via HTTP Bearer authentication to refresh an access
                      token
                    examples:
                    - a844185d4a924f52eec40d5b83f68fed8953665553b134dd5a02521250205b19
                    title: Refresh Token
                    type: string
                required:
                - access_token
                - refresh_token
                - expiration_utc_datetime
                - description
                title: AccessTokenModel
                type: object
          description: 'Created: Document created, URL follows'
        '400':
          $ref: '#/components/responses/BadRequestErrorModel'
      summary: Create a new access token.
      tags:
      - authentication
  /action_types/:
    get:
